name: CI
on:
  pull_request:
  push:
    branches: ["master"]
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*

      # Runs the emitted serializers rather than only comparing them against snapshots; see
      # Loom.Testing/SerializationRuntimeTest.cs. Without it those tests fail rather than skip.
      - name: Install Lune
        run: |
          LUNE_VERSION=0.10.5
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          unzip -o -q lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure PATH for tools
        run: echo "/home/runner/.dotnet/tools" >> $GITHUB_PATH

      - name: Run tests and generate coverage
        run: |
          dotnet test -c Release --collect:"XPlat Code Coverage" --settings Loom.Testing/coverlet.runsettings

      - name: Convert coverage to LCOV
        run: |
          reportgenerator -reports:"**/TestResults/**/*.cobertura.xml" -targetdir:"coverage" -reporttypes:lcov
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Report coverage
        continue-on-error: true
        uses: coverallsapp/github-action@v2.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
